name: PHP Tests

on:
    push:
        branches: [ master ]
    pull_request:
        branches: [ master ]

jobs:
    test-php80:
        runs-on: ubuntu-latest
        name: PHP 8.0 Tests

        steps:
            - name: Checkout code
              uses: actions/checkout@v3

            - name: Setup PHP 8.0
              uses: shivammathur/setup-php@v2
              with:
                  php-version: 8.0
                  coverage: xdebug
                  tools: composer

            - name: Install dependencies
              run: composer install --no-progress --prefer-dist

            - name: Run tests with coverage
              run: vendor/bin/phpunit --coverage-clover=coverage.xml --whitelist=src

            - name: Upload coverage to Codecov
              uses: codecov/codecov-action@v3
              env:
                  CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
              with:
                  file: ./coverage.xml

